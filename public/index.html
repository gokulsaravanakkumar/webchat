<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleek Chat App</title>
    <!-- Adding Google Font for the 'Inter' font used in your CSS -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- LOGIN SCREEN -->
        <div id="join-screen" class="card">
            <h3>Chat Login</h3>
            <div id="error-msg" style="color: #ef4444; font-size: 0.8rem; margin-bottom: 10px;"></div>
            <div class="input-group">
                <input type="text" id="username" placeholder="Username">
                <input type="password" id="password" placeholder="Password">
                <input type="text" id="roomId" placeholder="Room ID (e.g. 101)">
            </div>
            <button onclick="handleLogin()" class="btn-primary">Join Room</button>
        </div>

        <!-- CHAT SCREEN -->
        <div id="chat-app" class="card chat-card" style="display: none;">
            <div class="chat-header">
                <div class="user-info">
                    <span class="status-dot"></span>
                    <span id="userLabel" style="margin-left: 8px;"></span>
                </div>
                <div class="room-label">Room: <span id="currentRoom"></span></div>
            </div>

            <div id="message-container"></div>

            <div class="chat-input-area">
                <input type="text" id="msg-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()" class="btn-send">Send</button>
            </div>
            <button onclick="location.reload()" class="btn-logout">Logout</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
