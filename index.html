<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sleek Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#6366f1;--accent:#a855f7;--bg-card:rgba(15,23,42,0.88);--bg-input:rgba(15,23,42,0.7);--border:rgba(255,255,255,0.08);--bfocus:rgba(99,102,241,0.6);--text:#f1f5f9;--muted:#94a3b8;--other:rgba(30,41,59,0.95);--ok:#10b981;--bad:#f43f5e}
body{font-family:'Inter',sans-serif;background:#0f172a;color:var(--text);min-height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden;position:relative}
body::before,body::after{content:'';position:fixed;border-radius:50%;filter:blur(90px);opacity:.18;animation:drift 14s ease-in-out infinite alternate;pointer-events:none;z-index:0}
body::before{width:520px;height:520px;background:radial-gradient(circle,#6366f1,transparent);top:-120px;left:-120px}
body::after{width:420px;height:420px;background:radial-gradient(circle,#a855f7,transparent);bottom:-100px;right:-100px;animation-delay:-7s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(50px,35px) scale(1.12)}}
.screen{position:relative;z-index:1}
.card{background:var(--bg-card);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:24px;box-shadow:0 32px 64px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06)}
#login-screen{width:390px;padding:2.5rem}
.logo{display:flex;align-items:center;gap:13px;margin-bottom:2rem}
.logo .icon{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.logo h1{font-size:1.45rem;font-weight:700;letter-spacing:-.02em}
.logo p{font-size:.78rem;color:var(--muted);margin-top:3px}
.field{margin-bottom:15px}
.field label{display:block;font-size:.72rem;font-weight:600;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:.06em}
.field input{width:100%;padding:13px 15px;background:var(--bg-input);border:1px solid rgba(255,255,255,.1);border-radius:12px;color:var(--text);font-size:.95rem;font-family:inherit;outline:none;transition:border-color .2s,box-shadow .2s}
.field input::placeholder{color:#475569}
.field input:focus{border-color:var(--bfocus);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.err{background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.3);border-radius:10px;padding:10px 14px;font-size:.82rem;color:#fda4af;margin-bottom:14px;display:none;animation:shake .3s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--primary),var(--accent));border:none;border-radius:12px;color:#fff;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 20px rgba(99,102,241,.38);display:flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(99,102,241,.48)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;display:none}
@keyframes rot{to{transform:rotate(360deg)}}
.foot{text-align:center;margin-top:18px;font-size:.78rem;color:#475569;line-height:1.8}
.foot strong{color:#7c85f3}
#chat-screen{display:none;width:480px;height:700px;flex-direction:column;padding:0;overflow:hidden}
#chat-screen.on{display:flex}
.ch{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);background:rgba(15,23,42,.5);flex-shrink:0}
.ch-l{display:flex;align-items:center;gap:12px}
.av{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.ct{font-size:.95rem;font-weight:700}
.cs{font-size:.72rem;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok);display:inline-block;flex-shrink:0}
.ch-r{display:flex;align-items:center;gap:10px}
.badge{background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.3);color:#a5b4fc;font-size:.72rem;font-weight:600;padding:4px 11px;border-radius:20px}
.lob{background:none;border:none;color:var(--bad);cursor:pointer;padding:7px;border-radius:9px;transition:background .2s;display:flex;align-items:center;justify-content:center}
.lob:hover{background:rgba(244,63,94,.12)}
.lob svg{width:17px;height:17px}
#feed{flex:1;overflow-y:auto;padding:18px 16px 10px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
#feed::-webkit-scrollbar{width:4px}
#feed::-webkit-scrollbar-track{background:transparent}
#feed::-webkit-scrollbar-thumb{background:rgba(99,102,241,.35);border-radius:4px}
.mw{display:flex;flex-direction:column;max-width:100%}
.mw.mine{align-items:flex-end}
.mw.theirs{align-items:flex-start}
.mw.sys{align-items:center}
.sdr{font-size:.7rem;font-weight:600;color:var(--muted);margin-bottom:4px;padding:0 4px}
.bub{max-width:78%;padding:11px 15px;border-radius:18px;font-size:.9rem;line-height:1.5;animation:pop .22s ease;word-break:break-word}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.mine .bub{background:linear-gradient(135deg,var(--primary),var(--accent));border-bottom-right-radius:5px;color:#fff}
.theirs .bub{background:var(--other);border:1px solid var(--border);border-bottom-left-radius:5px}
.sys .bub{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:20px;font-size:.74rem;color:var(--muted);padding:5px 14px}
.ts{font-size:.65rem;color:#475569;margin-top:4px;padding:0 4px}
.cf{padding:12px 16px 16px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:center;flex-shrink:0}
.cf input{flex:1;background:var(--bg-input);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px 15px;color:var(--text);font-size:.9rem;font-family:inherit;outline:none;transition:border-color .2s,box-shadow .2s}
.cf input::placeholder{color:#475569}
.cf input:focus{border-color:var(--bfocus);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.sb{width:44px;height:44px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 14px rgba(99,102,241,.32)}
.sb:hover{transform:scale(1.07);box-shadow:0 6px 18px rgba(99,102,241,.45)}
.sb:active{transform:scale(.95)}
.sb svg{width:18px;height:18px}
#conn{position:absolute;inset:0;z-index:10;background:rgba(15,23,42,.85);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;border-radius:24px}
#conn p{font-size:.88rem;color:var(--muted)}
.bspin{width:36px;height:36px;border:3px solid rgba(99,102,241,.2);border-top-color:var(--primary);border-radius:50%;animation:rot .8s linear infinite}
</style>
</head>
<body>

<div id="login-screen" class="screen card">
  <div class="logo">
    <div class="icon">💬</div>
    <div><h1>Sleek Chat</h1><p>Real-time messaging across any device</p></div>
  </div>
  <div class="err" id="err"></div>
  <div class="field"><label>Username</label><input type="text" id="iu" placeholder="phoenix or cookie" autocomplete="off"></div>
  <div class="field"><label>Password</label><input type="password" id="ip" placeholder="Enter your password"></div>
  <div class="field"><label>Room ID</label><input type="text" id="ir" placeholder="e.g. 101" autocomplete="off"></div>
  <button class="btn" id="lbtn" onclick="doLogin()">
    <span id="lt">Join Room →</span><div class="spin" id="ls"></div>
  </button>
</div>

<div id="chat-screen" class="screen card" style="position:relative">
  <div id="conn"><div class="bspin"></div><p>Connecting to Firebase…</p></div>
  <div class="ch">
    <div class="ch-l">
      <div class="av">🏠</div>
      <div><div class="ct" id="rtitle">Room —</div><div class="cs"><span class="dot"></span><span id="cstatus">Connected</span></div></div>
    </div>
    <div class="ch-r">
      <span class="badge" id="rbadge">Room —</span>
      <button class="lob" onclick="doLogout()" title="Logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </div>
  </div>
  <div id="feed"></div>
  <div class="cf">
    <input type="text" id="mi" placeholder="Type a message…" autocomplete="off" onkeydown="if(event.key==='Enter')sendMsg()">
    <button class="sb" onclick="sendMsg()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyAn3dSJ1uaCeZj6b6yG2PUn_xA2JyLrg1c",
  authDomain:"sleek-chat-218f8.firebaseapp.com",
  databaseURL:"https://sleek-chat-218f8-default-rtdb.firebaseio.com",
  projectId:"sleek-chat-218f8",
  storageBucket:"sleek-chat-218f8.firebasestorage.app",
  messagingSenderId:"1096318546925",
  appId:"1:1096318546925:web:c6ae8f5fdf5326403a2de4"
});
const db=firebase.database();
const USERS=[{username:"phoenix",password:"6369"},{username:"cookie",password:"6384"}];
let me="",room="",ref=null,lsn=null;
const seen=new Set();

function doLogin(){
  const u=document.getElementById("iu").value.trim().toLowerCase();
  const p=document.getElementById("ip").value.trim();
  const r=document.getElementById("ir").value.trim();
  document.getElementById("err").style.display="none";
  if(!u||!p||!r){setErr("Please fill in all fields.");return;}
  const ok=USERS.find(x=>x.username===u&&x.password===p);
  if(!ok){setErr("Invalid username or password.");return;}
  me=ok.username;room=r;
  document.getElementById("lbtn").disabled=true;
  document.getElementById("lt").style.display="none";
  document.getElementById("ls").style.display="block";
  document.getElementById("login-screen").style.display="none";
  document.getElementById("chat-screen").style.display="flex";
  document.getElementById("rtitle").textContent="Room "+r;
  document.getElementById("rbadge").textContent="Room "+r;
  connect();
}

function connect(){
  ref=db.ref("rooms/"+room+"/messages");
  db.ref(".info/connected").on("value",s=>{
    if(s.val()===true){
      document.getElementById("conn").style.display="none";
      if(!lsn){
        pushSys(me+" joined the room");
        const t0=Date.now();
        lsn=ref.orderByChild("ts").startAt(t0).on("child_added",snap=>{
          if(seen.has(snap.key))return;
          seen.add(snap.key);
          render(snap.val());
        });
        db.ref("rooms/"+room+"/online/"+me).set(true);
        db.ref("rooms/"+room+"/online/"+me).onDisconnect().remove();
        document.getElementById("mi").focus();
      }
    }
  });
}

function sendMsg(){
  const i=document.getElementById("mi"),t=i.value.trim();
  if(!t||!ref)return;
  i.value="";
  ref.push({username:me,text:t,ts:firebase.database.ServerValue.TIMESTAMP,time:now()});
}

function pushSys(text){
  if(ref)ref.push({username:"System",text,ts:firebase.database.ServerValue.TIMESTAMP,time:now()});
}

function render(d){
  const isSys=d.username==="System",isMe=d.username===me;
  const w=mk("div",isSys?"mw sys":isMe?"mw mine":"mw theirs");
  if(!isSys&&!isMe){const s=mk("div","sdr");s.textContent=d.username;w.appendChild(s);}
  const b=mk("div","bub");b.textContent=d.text;w.appendChild(b);
  if(!isSys){const t=mk("div","ts");t.textContent=d.time;w.appendChild(t);}
  const f=document.getElementById("feed");
  f.appendChild(w);f.scrollTop=f.scrollHeight;
}

function doLogout(){
  if(ref)pushSys(me+" left the room");
  if(me&&room)db.ref("rooms/"+room+"/online/"+me).remove();
  if(ref&&lsn){ref.off("child_added",lsn);lsn=null;}
  ref=null;seen.clear();me="";room="";
  document.getElementById("feed").innerHTML="";
  document.getElementById("chat-screen").style.display="none";
  document.getElementById("login-screen").style.display="block";
  document.getElementById("ip").value="";
  document.getElementById("conn").style.display="flex";
  document.getElementById("lbtn").disabled=false;
  document.getElementById("lt").style.display="inline";
  document.getElementById("ls").style.display="none";
}

function mk(t,c){const e=document.createElement(t);if(c)e.className=c;return e;}
function now(){return new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});}
function setErr(m){const e=document.getElementById("err");e.textContent=m;e.style.display="block";}
window.addEventListener("beforeunload",()=>{if(me&&room)db.ref("rooms/"+room+"/online/"+me).remove();});
</script>
</body>
</html>
